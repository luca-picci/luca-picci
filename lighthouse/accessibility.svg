<svg xmlns="http://www.w3.org/2000/svg"
     width="160" height="160"
     viewBox="0 0 160 160"
     role="img"
     aria-labelledby="accessibility-title accessibility-desc">
  <title id="accessibility-title">Accessibility</title>
  <desc id="accessibility-desc">Accessibility score 100 of 100</desc>

  <defs>
    <filter id="accessibility-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000040"/>
    </filter>

    <radialGradient id="accessibility-bg-gradient" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </radialGradient>

    <linearGradient id="accessibility-arc-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0cce6b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0cce6b" stop-opacity="1" />
    </linearGradient>

    <style>
      .lh-label {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 500;
        fill: #5f6368;
      }
      .lh-score {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 30px;
        font-weight: 600;
        fill: #111827;
      }
    </style>
  </defs>

  <rect
    x="12"
    y="12"
    width="136"
    height="136"
    rx="18"
    fill="#ffffff"
    stroke="#e5e7eb"
    filter="url(#accessibility-shadow)"
  />

  <circle
    cx="80"
    cy="66"
    r="50"
    fill="url(#accessibility-bg-gradient)"
    stroke="#e5e7eb"
    stroke-width="11"
  />
  <circle
    cx="80"
    cy="66"
    r="41"
    fill="#ffffff"
  />

  <circle
    cx="80"
    cy="66"
    r="50"
    fill="none"
    stroke="url(#accessibility-arc-gradient)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-dasharray="314.1592653589793 0"
    transform="rotate(-90 80 66)"
  />

  <text
    x="80"
    y="72"
    text-anchor="middle"
    class="lh-score"
  >
    100
  </text>

  <text
    x="80"
    y="146"
    text-anchor="middle"
    class="lh-label"
  >
    Accessibility
  </text>
</svg>