<svg xmlns="http://www.w3.org/2000/svg"
     width="160" height="160"
     viewBox="0 0 160 160"
     role="img"
     aria-labelledby="performance-title performance-desc">
  <title id="performance-title">Performance</title>
  <desc id="performance-desc">Performance score 97 of 100</desc>

  <defs>
    <filter id="performance-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00000040"/>
    </filter>

    <linearGradient id="performance-arc-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="1" />
    </linearGradient>

    <style>
      .lh-card {
        fill: #ffffff;
        stroke: #e5e7eb;
      }
      .lh-circle-bg {
        fill: #f9fafb;
        stroke: #e5e7eb;
      }
      .lh-circle-inner {
        fill: #ffffff;
      }
      .lh-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        fill: #6b7280;
      }
      .lh-score {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 30px;
        font-weight: 600;
        fill: #111827;
      }

      @media (prefers-color-scheme: dark) {
        .lh-card {
          fill: #020617;
          stroke: #1f2933;
        }
        .lh-circle-bg {
          fill: #020617;
          stroke: #374151;
        }
        .lh-circle-inner {
          fill: #020617;
        }
        .lh-title {
          fill: #9ca3af;
        }
        .lh-score {
          fill: #e5e7eb;
        }
      }
    </style>
  </defs>

  <rect
    x="12"
    y="12"
    width="136"
    height="136"
    rx="18"
    class="lh-card"
    filter="url(#performance-shadow)"
  />

  <text
    x="80"
    y="26"
    text-anchor="middle"
    class="lh-title"
  >
    Performance
  </text>

  <circle
    cx="80"
    cy="91"
    r="50"
    class="lh-circle-bg"
    stroke-width="11"
  />
  <circle
    cx="80"
    cy="91"
    r="41"
    class="lh-circle-inner"
  />

  <circle
    cx="80"
    cy="91"
    r="50"
    fill="none"
    stroke="url(#performance-arc-gradient)"
    stroke-width="11"
    stroke-linecap="round"
    stroke-dasharray="304.7344873982099 9.424777960769404"
    transform="rotate(-90 80 91)"
  />

  <text
    x="80"
    y="97"
    text-anchor="middle"
    class="lh-score"
  >
    97
  </text>
</svg>