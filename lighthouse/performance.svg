<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Performance score 74">
  <defs>
    <!-- Ombra molto leggera e morbida -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000055"/>
    </filter>

    <style>
      .label {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
        fill: #5f6368;
      }
      .score {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 28px;
        font-weight: 600;
        fill: #202124;
      }
    </style>
  </defs>

  <rect
    x="10"
    y="10"
    width="120"
    height="120"
    rx="14"
    fill="#ffffff"
    stroke="#dadce0"
    filter="url(#cardShadow)"
  />

  <circle
    cx="70"
    cy="64"
    r="48"
    fill="none"
    stroke="#e6e6e6"
    stroke-width="10"
  />

  <circle
    cx="70"
    cy="64"
    r="48"
    fill="none"
    stroke="#ffa400"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="223.1787421110189 78.41415263360125"
    transform="rotate(-90 70 64)"
  />

  <text
    x="70"
    y="68"
    text-anchor="middle"
    class="score"
  >
    74
  </text>

  <text
    x="70"
    y="118"
    text-anchor="middle"
    class="label"
  >
    Performance
  </text>
