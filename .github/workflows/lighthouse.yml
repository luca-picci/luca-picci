name: Lighthouse Scores

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    env:
      LIGHTHOUSE_SITES: ${{ secrets.LIGHTHOUSE_SITES }}

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Unlighthouse
        run: |
          npm init -y
          npm install @unlighthouse/cli puppeteer

      - name: Run Unlighthouse CI
        run: |
          SITE=$(printf '%s\n' "$LIGHTHOUSE_SITES" \
            | sed 's/\r$//' \
            | grep -v '^[[:space:]]*#' \
            | grep -v '^[[:space:]]*$' \
            | head -n 1)
          echo "Using site: $SITE"
          if [ -z "$SITE" ]; then
            echo "No site configured in LIGHTHOUSE_SITES"
            exit 1
          fi
          npx unlighthouse-ci --site "$SITE" --reporter json

      - name: Generate gauges from Unlighthouse report
        run: |
          node scripts/unlighthouse-gauges.js

      - name: Clone PUBLIC repo (luca-picci)
        run: |
          git clone https://x-access-token:${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/luca-picci/luca-picci.git output-repo

      - name: Copy results into PUBLIC repo
        run: |
          mkdir -p output-repo/lighthouse
          cp lighthouse/*.svg output-repo/lighthouse/ || echo "No SVG files to copy"

      - name: Commit & push to PUBLIC repo
        working-directory: output-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lighthouse
          git commit -m "Update Lighthouse scores from Unlighthouse" || echo "No changes to commit"
          git push origin main
